version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: task_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: task_backend_api
    restart: always
    ports:
      - "${PORT:-5001}:5001"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: 5001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: task_frontend_spa
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: task_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  pgdata:
